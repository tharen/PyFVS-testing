# This workflow builds binary wheels using cibuildwheel and a source distribution.
# cibuildwheel handles manylinux and Windows wheel building across Python versions.
# Publishes to TestPyPI on pushes to dev, and PyPI on pushes to main.

name: Build Packages

on:
  push:
    branches: [ "main", "dev" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ "main" ]

jobs:
  make-wheels:
    name: Build wheels for ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ['cp314']
        include:
          - os: macos-latest
            compiler: gcc
          
    steps:
    - name: Fortran Setup
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.compiler }}

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Show compiler versions
      run: |
        gfortran --version

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.1
      env:
        CIBW_BUILD: ${{ matrix.python }}-*
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
        CIBW_ARCHS_MACOS: auto
        
        CIBW_BEFORE_BUILD_MACOS: |
          brew install gcc ninja
          pip install click numpy pandas build wheel setuptools setuptools_scm meson-python ninja
        
        CIBW_ENVIRONMENT_MACOS: FC=gfortran F90=gfortran F77=gfortran
        CIBW_BUILD_FRONTEND: "build"
        CIBW_BUILD_VERBOSITY: 1

      with:
        output-dir: dist

    - name: Store wheels
      uses: actions/upload-artifact@v7
      with:
        name: pyfvs-${{ matrix.os }}-${{ matrix.python }}-wheels
        path: dist/*.whl
        if-no-files-found: warn
        overwrite: true

  make-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        architecture: x64
        cache: pip

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install click numpy pandas build wheel \
          setuptools setuptools_scm meson-python ninja patchelf

    - name: Create sdist
      run: python -m build --sdist --no-isolation

    - name: Store sdist
      uses: actions/upload-artifact@v7
      with:
        name: pyfvs-sdist
        path: dist/*.tar.gz
        if-no-files-found: warn
        overwrite: true

  publish-testpypi:
    name: Publish to TestPyPI (dev branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [ make-wheels, make-sdist ]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyfvs
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: pyfvs-*-wheels
        path: dist
        merge-multiple: true

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: pyfvs-sdist
        path: dist

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true

  publish-pypi:
    name: Publish to PyPI (main branch)
    # Run on push to main branch or on tag push (for releases)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ make-wheels, make-sdist ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyfvs
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: pyfvs-*-wheels
        path: dist
        merge-multiple: true

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: pyfvs-sdist
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        verbose: true
